[project]
name = "beholder-backend"
version = "0.1.0"
description = "beholder backend: one fastapi service, any postgres, one model gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "alembic>=1.13"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
